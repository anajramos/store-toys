  <text x="204" y="91" font-family="serif" font-size="5" fill="#ec4899" text-anchor="middle">✦BT✦</text>
  <text x="204" y="100" font-family="serif" font-size="4" fill="#f9a8d4" text-anchor="middle">pano</text>
  <!-- Fio da tag -->
