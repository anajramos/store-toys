<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 380" width="280" height="380">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </radialGradient>
    <!-- Tom de pele tecido bege -->
    <radialGradient id="skin" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f9d9aa"/>
      <stop offset="100%" stop-color="#e8b87a"/>
    </radialGradient>
    <!-- Tecido preto camiseta -->
    <radialGradient id="blackFab" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#111827"/>
    </radialGradient>
    <!-- Jeans -->
    <radialGradient id="jeans" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6b7280"/>
      <stop offset="100%" stop-color="#374151"/>
    </radialGradient>
  </defs>

  <!-- Fundo -->
  <rect width="280" height="380" fill="url(#bg)" rx="28"/>
  <!-- Bolinhas decorativas de fundo -->
  <circle cx="28" cy="35" r="10" fill="#93c5fd" opacity="0.25"/>
  <circle cx="252" cy="42" r="8" fill="#93c5fd" opacity="0.2"/>
  <circle cx="22" cy="340" r="12" fill="#93c5fd" opacity="0.2"/>
  <circle cx="258" cy="330" r="9" fill="#93c5fd" opacity="0.18"/>

  <!-- ===== PERNAS - cilindros de pano com costura ===== -->
  <!-- Perna esquerda -->
  <rect x="100" y="268" width="34" height="82" rx="17" fill="url(#jeans)"/>
  <!-- Costura perna esq -->
  <line x1="117" y1="272" x2="117" y2="344" stroke="#4b5563" stroke-width="1.2" stroke-dasharray="5,4" opacity="0.5"/>
  <!-- Perna direita -->
  <rect x="146" y="268" width="34" height="82" rx="17" fill="url(#jeans)"/>
  <!-- Costura perna dir -->
  <line x1="163" y1="272" x2="163" y2="344" stroke="#4b5563" stroke-width="1.2" stroke-dasharray="5,4" opacity="0.5"/>

  <!-- Sapato/pé esq -->
  <ellipse cx="117" cy="350" rx="24" ry="11" fill="#1e293b"/>
  <ellipse cx="114" cy="347" rx="16" ry="7" fill="#334155"/>
  <!-- Sapato/pé dir -->
  <ellipse cx="163" cy="350" rx="24" ry="11" fill="#1e293b"/>
  <ellipse cx="160" cy="347" rx="16" ry="7" fill="#334155"/>

  <!-- ===== CORPO - formato boneco de pano fofo ===== -->
  <rect x="82" y="152" width="116" height="124" rx="30" fill="url(#blackFab)"/>
  <!-- Costura lateral corpo -->
  <line x1="86" y1="162" x2="86" y2="268" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="6,5" opacity="0.4"/>
  <line x1="194" y1="162" x2="194" y2="268" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="6,5" opacity="0.4"/>
  <!-- Costura horizontal no meio -->
  <line x1="90" y1="214" x2="190" y2="214" stroke="#4b5563" stroke-width="1" stroke-dasharray="5,4" opacity="0.3"/>

  <!-- Logo SENAI na camiseta -->
  <rect x="104" y="175" width="72" height="44" rx="8" fill="#dc2626"/>
  <text x="140" y="194" font-family="Arial Black, sans-serif" font-size="13" font-weight="900" fill="white" text-anchor="middle" letter-spacing="1">SENAI</text>
  <text x="140" y="207" font-family="Arial, sans-serif" font-size="6" fill="white" text-anchor="middle">APRENDIZAGEM IND.</text>

  <!-- Botão da camiseta (detalhe boneco de pano) -->
  <circle cx="140" cy="240" r="5" fill="#374151" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="140" cy="240" r="2" fill="none" stroke="#9ca3af" stroke-width="1"/>
  <line x1="139" y1="240" x2="141" y2="240" stroke="#9ca3af" stroke-width="0.8"/>
  <line x1="140" y1="239" x2="140" y2="241" stroke="#9ca3af" stroke-width="0.8"/>
  <!-- Segundo botão -->
  <circle cx="140" cy="256" r="5" fill="#374151" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="140" cy="256" r="2" fill="none" stroke="#9ca3af" stroke-width="1"/>
  <line x1="139" y1="256" x2="141" y2="256" stroke="#9ca3af" stroke-width="0.8"/>
  <line x1="140" y1="255" x2="140" y2="257" stroke="#9ca3af" stroke-width="0.8"/>

  <!-- ===== BRAÇOS - rolinhos de pano ===== -->
  <!-- Braço esquerdo -->
  <rect x="34" y="158" width="52" height="26" rx="13" fill="url(#blackFab)"/>
  <!-- Costura braço esq -->
  <line x1="38" y1="171" x2="82" y2="171" stroke="#4b5563" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
  <!-- Mão esq - boneco de pano = arredondada sem dedos visíveis -->
  <ellipse cx="42" cy="196" rx="20" ry="18" fill="url(#skin)"/>
  <!-- Costura mão esq -->
  <path d="M28,196 Q42,184 56,196 Q42,208 28,196" fill="none" stroke="#d4a070" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- Braço direito -->
  <rect x="194" y="158" width="52" height="26" rx="13" fill="url(#blackFab)"/>
  <!-- Costura braço dir -->
  <line x1="198" y1="171" x2="242" y2="171" stroke="#4b5563" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
  <!-- Mão dir -->
  <ellipse cx="238" cy="196" rx="20" ry="18" fill="url(#skin)"/>
  <!-- Costura mão dir -->
  <path d="M224,196 Q238,184 252,196 Q238,208 224,196" fill="none" stroke="#d4a070" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- ===== PESCOÇO ===== -->
  <rect x="126" y="138" width="28" height="20" rx="10" fill="url(#skin)"/>
  <!-- Costura pescoço -->
  <line x1="130" y1="140" x2="150" y2="140" stroke="#d4a070" stroke-width="1" stroke-dasharray="3,2" opacity="0.4"/>

  <!-- ===== CABEÇA - redonda fofa boneco de pano ===== -->
  <ellipse cx="140" cy="100" rx="66" ry="68" fill="url(#skin)"/>
  <!-- Costura circular cabeça (característica boneco de pano!) -->
  <path d="M76,85 Q108,40 140,38 Q172,40 204,85" fill="none" stroke="#d4a070" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.4"/>
  <path d="M76,115 Q80,148 140,162 Q200,148 204,115" fill="none" stroke="#d4a070" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.4"/>

  <!-- Orelhas de pano (simples e arredondadas) -->
  <ellipse cx="75" cy="100" rx="13" ry="16" fill="#e8b87a"/>
  <ellipse cx="205" cy="100" rx="13" ry="16" fill="#e8b87a"/>
  <!-- Costura orelha -->
  <ellipse cx="75" cy="100" rx="7" ry="10" fill="none" stroke="#d4a070" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>
  <ellipse cx="205" cy="100" rx="7" ry="10" fill="none" stroke="#d4a070" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>

  <!-- CARECA - liso com costura no topo -->
  <ellipse cx="140" cy="60" rx="62" ry="44" fill="#f9d9aa"/>
  <!-- Linha de costura do topo da cabeça (boneco de pano) -->
  <path d="M96,52 Q140,34 184,52" fill="none" stroke="#d4a070" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.5"/>
  <!-- Brilho bald -->
  <ellipse cx="120" cy="50" rx="22" ry="12" fill="white" opacity="0.3"/>

  <!-- ===== ÓCULOS estilo boneco (grossos, simples) ===== -->
  <!-- Armação roliça de boneco -->
  <rect x="100" y="97" width="34" height="22" rx="9" fill="none" stroke="#1a1a2e" stroke-width="5"/>
  <rect x="146" y="97" width="34" height="22" rx="9" fill="none" stroke="#1a1a2e" stroke-width="5"/>
  <!-- Ponte -->
  <line x1="134" y1="107" x2="146" y2="107" stroke="#1a1a2e" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Hastes -->
  <line x1="100" y1="106" x2="84" y2="103" stroke="#1a1a2e" stroke-width="4" stroke-linecap="round"/>
  <line x1="180" y1="106" x2="196" y2="103" stroke="#1a1a2e" stroke-width="4" stroke-linecap="round"/>
  <!-- Lentes reflexo de tecido -->
  <rect x="103" y="100" width="28" height="16" rx="7" fill="#bfdbfe" opacity="0.4"/>
  <rect x="149" y="100" width="28" height="16" rx="7" fill="#bfdbfe" opacity="0.4"/>
  <ellipse cx="111" cy="105" rx="6" ry="4" fill="white" opacity="0.5"/>
  <ellipse cx="157" cy="105" rx="6" ry="4" fill="white" opacity="0.5"/>

  <!-- OLHOS de boneco (botões!) -->
  <circle cx="117" cy="108" r="6" fill="#1e293b"/>
  <circle cx="163" cy="108" r="6" fill="#1e293b"/>
  <!-- Cruz do botão -->
  <line x1="115" y1="108" x2="119" y2="108" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="117" y1="106" x2="117" y2="110" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="161" y1="108" x2="165" y2="108" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="163" y1="106" x2="163" y2="110" stroke="#6b7280" stroke-width="1.2"/>

  <!-- SOBRANCELHAS costuradas -->
  <path d="M101,91 Q117,83 133,91" stroke="#5c3d1a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M147,91 Q163,83 179,91" stroke="#5c3d1a" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- NARIZ de botão/costura -->
  <ellipse cx="140" cy="126" rx="7" ry="5.5" fill="#d4a070"/>
  <!-- Costura do nariz -->
  <line x1="140" y1="122" x2="140" y2="130" stroke="#c49060" stroke-width="1.5" stroke-linecap="round"/>

  <!-- ===== BARBA JOVEM estilo boneco de pano ===== -->
  <!-- Barba como uma "peça de tecido" costurada no rosto -->
  <!-- Shape da barba -->
  <path d="M107,138 Q108,155 120,166 Q140,175 160,166 Q172,155 173,138 Q163,145 140,147 Q117,145 107,138Z" fill="#3d2410"/>
  <!-- Bigode separado -->
  <path d="M125,134 Q133,128 140,130 Q147,128 155,134" fill="#3d2410"/>
  <!-- Costura/textura da barba (pontilhado) -->
  <path d="M115,150 Q140,160 165,150" fill="none" stroke="#5c3d1a" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <path d="M117,142 Q140,148 163,142" fill="none" stroke="#5c3d1a" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>

  <!-- BOCA costurada embaixo da barba -->
  <path d="M126,137 Q140,147 154,137" stroke="#c07850" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- BLUSH de feltro nas bochechas -->
  <ellipse cx="100" cy="127" rx="14" ry="9" fill="#fca5a5" opacity="0.5"/>
  <ellipse cx="180" cy="127" rx="14" ry="9" fill="#fca5a5" opacity="0.5"/>

  <!-- TAG de boneco de pano (etiquetinha costurada) -->
  <rect x="196" y="86" width="22" height="14" rx="3" fill="white" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="196" y1="93" x2="218" y2="93" stroke="#9ca3af" stroke-width="0.8"/>
  <text x="207" y="90" font-family="serif" font-size="5" fill="#6b7280" text-anchor="middle">✦DD✦</text>
  <text x="207" y="100" font-family="serif" font-size="4" fill="#9ca3af" text-anchor="middle">pano</text>
  <!-- Fio da tag -->
  <line x1="207" y1="86" x2="207" y2="80" stroke="#d1d5db" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Nome tag -->
  <rect x="76" y="365" width="128" height="22" rx="11" fill="#111827"/>
  <text x="140" y="381" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">🧔 Dudu</text>
</svg>
